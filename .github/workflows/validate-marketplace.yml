name: validate-marketplace

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "scripts/validate_marketplace.py"
      - "scripts/marketplace-excluded.json"
      - "scripts/validate_skills.py"
      - "tests/**"
      - ".github/workflows/validate-marketplace.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "scripts/validate_marketplace.py"
      - "scripts/marketplace-excluded.json"
      - "scripts/validate_skills.py"
      - "tests/**"
      - ".github/workflows/validate-marketplace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install pyyaml==6.0.3

      - name: Test the validator
        run: python -m unittest discover tests

      - name: Validate the marketplace
        run: python scripts/validate_marketplace.py

      - name: Validate the schema with Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.317
          claude plugin validate .claude-plugin/marketplace.json --strict
